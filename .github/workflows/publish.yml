name: publish

# GitHub 上で Release を「公開（published）」したときに PyPI へアップロードする。
# 手動実行（workflow_dispatch）を選ぶと TestPyPI へアップロードする。
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: 配布物をビルド
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ビルド用ツールをインストール
        run: python -m pip install --upgrade pip build twine

      - name: 配布物をビルド
        run: python -m build

      - name: メタデータを検査
        run: python -m twine check dist/*

      - name: 配布物を成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: PyPI へ公開
    # Release を公開したときだけ実行する
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    # PyPI 側の Trusted Publisher 設定で指定する環境名。
    # GitHub の Settings > Environments で "pypi" を作成しておく。
    environment:
      name: pypi
      url: https://pypi.org/project/py4project/

    permissions:
      # Trusted Publishing（OIDC）に必要。API トークンは不要。
      id-token: write

    steps:
      - name: 配布物をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: PyPI へアップロード
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: TestPyPI へ公開
    # 手動実行したときだけ TestPyPI に上げる（本番前の確認用）
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/project/py4project/

    permissions:
      id-token: write

    steps:
      - name: 配布物をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: TestPyPI へアップロード
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
