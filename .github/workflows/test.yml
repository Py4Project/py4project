name: test

# push と pull request のたびにテストを実行する。
# 手動実行（workflow_dispatch）も可能。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 1つのバージョンが失敗しても他のバージョンのテストは最後まで走らせる
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存パッケージとパッケージ本体をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: インストールされたバージョンを記録
        run: python -m pip list

      - name: pytest を実行
        # matplotlib が画面のない環境で動くように Agg バックエンドを使う
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -v

  build:
    # 配布物が正しくビルドでき、PyPI のメタデータ検査を通ることを確認する
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ビルド用ツールをインストール
        run: python -m pip install --upgrade pip build twine

      - name: 配布物をビルド
        run: python -m build

      - name: メタデータを検査
        run: python -m twine check dist/*
